<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primary)" stroke-width="6" opacity="0.4" />

  <!-- Center Circular Studio Emblem -->
  <circle cx="256" cy="256" r="160" fill="#18181b" stroke="#27272a" stroke-width="4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#primary)" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />

  <!-- Dynamic Waveform & Soundbars -->
  <g filter="url(#glow)">
    <rect x="156" y="216" width="16" height="80" rx="8" fill="url(#primary)" />
    <rect x="188" y="176" width="16" height="160" rx="8" fill="url(#primary)" />
    <rect x="220" y="140" width="16" height="232" rx="8" fill="url(#primary)" />
    <rect x="252" y="110" width="16" height="292" rx="8" fill="url(#primary)" />
    <rect x="284" y="150" width="16" height="212" rx="8" fill="url(#primary)" />
    <rect x="316" y="190" width="16" height="132" rx="8" fill="url(#primary)" />
    <rect x="348" y="230" width="16" height="52" rx="8" fill="url(#primary)" />
  </g>

  <!-- Musical Note Accent -->
  <path d="M 284 140 C 310 120, 340 120, 360 144" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)" />
</svg>
